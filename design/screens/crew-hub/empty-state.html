<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventure · Crew Hub — Empty State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EE; --card:#FFFFFF; --primary:#E2693E; --secondary:#138A6B;
    --success:#3D8060; --ink:#2A2521; --muted:#7A6E68; --divider:#ECE4D8;
    --font-display:"Fraunces",Georgia,serif; --font-body:"Satoshi","Inter",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:#15110d;font-family:var(--font-body);display:flex;flex-direction:column;
       align-items:center;gap:18px;padding:40px 0;min-height:100vh;color:var(--ink);}
  .caption{color:#cdbfb0;font-size:13px;letter-spacing:.04em;}

  .frame{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;
         position:relative;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.55);}

  .header{background:var(--secondary);color:#fff;flex:0 0 auto;}
  .statusbar{height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;}
  .statusbar .time{font-weight:700;font-size:15px;letter-spacing:.02em;}
  .sys{display:flex;align-items:center;gap:6px;}
  .topnav{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 6px;}
  .wordmark{font-family:var(--font-display);font-weight:600;font-size:23px;}

  .body{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;padding:0 36px;}

  /* illustration: overlapping people-circles */
  .illo{position:relative;width:200px;height:150px;margin-bottom:34px;}
  .blob{position:absolute;border-radius:50%;}
  .b1{width:96px;height:96px;background:var(--divider);left:6px;top:30px;}
  .b2{width:78px;height:78px;background:var(--divider);left:74px;top:8px;}
  .b3{width:64px;height:64px;background:var(--divider);left:120px;top:60px;}
  .b-accent{width:54px;height:54px;background:var(--primary);left:70px;top:60px;
            box-shadow:0 8px 22px rgba(226,105,62,.35);display:flex;align-items:center;justify-content:center;}
  .spark{position:absolute;}
  .s1{left:18px;top:14px;color:var(--secondary);opacity:.5;}
  .s2{left:170px;top:30px;color:var(--primary);opacity:.6;}

  .body h1{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.2;color:var(--ink);margin-bottom:12px;}
  .body p{font-size:15px;color:var(--muted);line-height:1.5;max-width:280px;margin-bottom:30px;}

  .actions{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px;}
  .btn-primary{width:100%;height:52px;background:var(--primary);color:var(--ink);border:none;border-radius:14px;
               font-family:var(--font-body);font-weight:500;font-size:15px;display:flex;align-items:center;
               justify-content:center;gap:9px;cursor:pointer;box-shadow:0 6px 18px rgba(226,105,62,.30);}
  .btn-ghost{width:100%;height:52px;background:transparent;color:var(--ink);border:1px solid var(--divider);
             border-radius:14px;font-family:var(--font-body);font-weight:500;font-size:15px;
             display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;}

  .bottom{flex:0 0 auto;}
  .tabbar{height:60px;background:var(--card);border-top:0.5px solid var(--divider);display:flex;align-items:center;justify-content:space-around;padding-top:6px;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:500;}
  .tab.active{color:var(--secondary);}
  .home-ind{height:34px;display:flex;align-items:center;justify-content:center;background:var(--card);}
  .home-ind i{width:134px;height:5px;border-radius:100px;background:rgba(42,37,33,.2);}
</style>
</head>
<body>
  <div class="caption">Aventure · Screen 10 — Crew Hub · <strong>Empty State (no crews yet)</strong></div>
  <div class="frame">

    <div class="header">
      <div class="statusbar">
        <span class="time">9:41</span>
        <span class="sys">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2C5.6 2 2.9 3.1 1 5l1.5 1.5C4 5 6.2 4 8.5 4S13 5 14.5 6.5L16 5c-1.9-1.9-4.6-3-7.5-3z"/><path d="M8.5 6c-1.6 0-3.1.6-4.2 1.7L8.5 12l4.2-4.3C11.6 6.6 10.1 6 8.5 6z"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff"/><rect x="23.5" y="3.5" width="2" height="5" rx="1" fill="#fff" fill-opacity=".6"/></svg>
        </span>
      </div>
      <div class="topnav">
        <span class="wordmark">aventure</span>
        <span class="bell">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </span>
      </div>
    </div>

    <div class="body">
      <div class="illo">
        <svg class="spark s1" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8z"/></svg>
        <svg class="spark s2" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8z"/></svg>
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b-accent">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15 19a4 4 0 0 1 6.5-3"/></svg>
        </span>
      </div>

      <h1>You're not in a crew yet.</h1>
      <p>Create one or join your friends to start your first quest.</p>

      <div class="actions">
        <button class="btn-primary">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2A2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create a crew
        </button>
        <button class="btn-ghost">Join a crew</button>
      </div>
    </div>

    <div class="bottom">
      <div class="tabbar">
        <div class="tab active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          Home
        </div>
        <div class="tab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          Memories
        </div>
        <div class="tab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="16 8 14 14 8 16 10 10"/></svg>
          Explore
        </div>
        <div class="tab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          Profile
        </div>
      </div>
      <div class="home-ind"><i></i></div>
    </div>

  </div>
</body>
</html>
